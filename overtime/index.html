<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overtime Calculator | Signal Labs</title>

  <link rel="stylesheet" href="style.css?v=0.3">
</head>
<body>

<main class="page">

  <header class="hero">
    <p class="eyebrow">Signal Labs</p>

    <h1>Overtime Calculator</h1>

    <p class="subtitle">
      Estimate regular pay, overtime pay, and total gross pay.
    </p>
  </header>

  <section class="layout">

    <section class="card">

      <h2>Inputs</h2>

      <div class="form-grid">

        <label>
          <span>Hourly Rate</span>
          <input id="rate" type="number" placeholder="25">
        </label>

        <label>
          <span>Hours Worked</span>
          <input id="hours" type="number" placeholder="48">
        </label>

        <label>
          <span>Overtime After</span>
          <input id="threshold" type="number" value="40">
        </label>

        <label>
          <span>Multiplier</span>
          <input id="multiplier" type="number" value="1.5" step=".1">
        </label>

      </div>

      <button id="calculate">
        Calculate Pay
      </button>

    </section>

    <section class="card">

      <h2>Results</h2>

      <div class="result-row">
        <span>Regular Hours</span>
        <strong id="regularHours">0</strong>
      </div>

      <div class="result-row">
        <span>Overtime Hours</span>
        <strong id="overtimeHours">0</strong>
      </div>

      <div class="result-row">
        <span>Regular Pay</span>
        <strong id="regularPay">$0.00</strong>
      </div>

      <div class="result-row">
        <span>Overtime Pay</span>
        <strong id="overtimePay">$0.00</strong>
      </div>

      <div class="result-row total">
        <span>Total Gross Pay</span>
        <strong id="totalPay">$0.00</strong>
      </div>

    </section>

  </section>

</main>

<footer class="version">
  Signal Labs · Overtime Calculator · v0.3
  <br>
  <span>An Allegedly Media project.</span>
</footer>

<script src="script.js"></script>

</body>
</html>
