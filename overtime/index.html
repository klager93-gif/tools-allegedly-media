<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overtime Calculator | Allegedly Media Tools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="calculator-card">
      <p class="eyebrow">Allegedly Media Tools</p>
      <h1>Overtime Calculator</h1>
      <p class="subtitle">Estimate regular pay, overtime pay, and total gross pay.</p>

      <div class="form-grid">
        <label>
          Hourly Rate
          <input id="rate" type="number" placeholder="25" step="0.01" />
        </label>

        <label>
          Hours Worked
          <input id="hours" type="number" placeholder="48" step="0.01" />
        </label>

        <label>
          Overtime After
          <input id="threshold" type="number" value="40" step="0.01" />
        </label>

        <label>
          Overtime Multiplier
          <input id="multiplier" type="number" value="1.5" step="0.01" />
        </label>
      </div>

      <button id="calculate">Calculate</button>

      <section class="results">
        <div>
          <span>Regular Pay</span>
          <strong id="regularPay">$0.00</strong>
        </div>
        <div>
          <span>Overtime Pay</span>
          <strong id="overtimePay">$0.00</strong>
        </div>
        <div class="total">
          <span>Total Pay</span>
          <strong id="totalPay">$0.00</strong>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
